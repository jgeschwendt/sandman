name: ci

# Public repo: Actions minutes are free, so the gate runs here as well as in hk's pre-push.
on:
  merge_group:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history: stele's freshness class walks verified.sha..HEAD.
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          components: clippy, llvm-tools-preview, rustfmt
          # Must match mise.toml's pin: lints.toml enumerates this toolchain's lints.
          toolchain: 1.94.0
      # mise.toml's pin: a drifting llvm-cov drifts what the 100 % counts.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # llama-cpp-sys-2's bindgen (runtime feature) dlopens a libclang that clang-sys finds by glob;
      # the image's clang packages are not a contract, so the library is named here (cmake and a
      # C++17 compiler for llama.cpp's CPU build come with the image; unverified 2026-11-22 · no run yet)
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo llvm-cov --workspace --fail-under-lines 100 --show-missing-lines
      # stele graph gate (check → emit --check). NEVER `stele build` here: it is the sole writer
      # of .stele/graph.lock, so running it would make check pass trivially.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
      - run: curl -fsSL https://raw.githubusercontent.com/jgeschwendt/stele/main/scripts/install.sh | bash -s v0.3.0
      - run: ~/.local/bin/stele check
      - run: ~/.local/bin/stele emit --check
