# The ruach's feeds — the seed `sandman breathe init` copies to
# ~/.sandman/breath/sources.toml when it is absent. Weight is learned there:
# adoption raises a source, a month of silence lowers it (`sandman breathe
# reweight`). Every verb that rewrites the file — file --source, adopt, drop,
# close, reweight — drops these comments. Budget is items a pass reads from
# the source. kind: atom | rss | json | html. bears_on: repo
# slugs or "*". The schema is docs/BANK-FORMAT.md § breath.

[anthropic-claude-code]
kind = "atom"
url = "https://github.com/anthropics/claude-code/releases.atom"
weight = 1.3
budget = 10
bears_on = ["jgeschwendt/bridge", "jgeschwendt/claude", "jgeschwendt/sandman", "jgeschwendt/dispatch"]

