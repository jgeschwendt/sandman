[exhaustiveness]
# `.github` is CI wiring, `design` holds the `.tldr` scenes (documents), `docs`
# is the plan (markdown + ui-styled page) — neither is code reachable from the
# router; the same reason orrery's excludes carry config/ and priv/.
exclude = [".github", "_build", "deps", "design", "docs", "node_modules", "target"]
