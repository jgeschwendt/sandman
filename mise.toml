# Pinned to the rust base (jgeschwendt/rust): its lints.toml enumerates this toolchain's lints.
[tools]
"cargo:cargo-llvm-cov" = "0.9.1"
# llama-cpp-sys-2 builds llama.cpp with it (sandman-infer).
cmake = "4.5.0"
# hk runs the pre-push gate (hk.pkl); `hk install --mise` wires it.
hk = "2.5.0"
rust = "1.94.0"

[tasks.check]
description = "the gate hk's pre-push runs over the workspace: fmt, clippy, 100 % line coverage"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  { task = "cover" },
]

[tasks.cover]
description = "both end-to-end suites under llvm-cov; anything under 100 % of lines fails, naming the lines"
run = "cargo llvm-cov --workspace --fail-under-lines 100 --show-missing-lines"

[tasks.install]
description = "a dev build to ~/.local/bin/sandman-next and its child sandman-infer-next, beside the release"
run = "cargo build --release --workspace && install -m 755 target/release/sandman ~/.local/bin/sandman-next && install -m 755 target/release/sandman-infer ~/.local/bin/sandman-infer-next"
