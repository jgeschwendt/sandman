# Pinned to the rust base (jgeschwendt/rust): its lints.toml enumerates this toolchain's lints.
[tools]
"cargo:cargo-llvm-cov" = "0.9.1"
# hk runs the pre-push gate (hk.pkl); `hk install --mise` wires it.
hk = "2.5.0"
rust = "1.94.0"

[tasks.check]
description = "the gate hk's pre-push runs: fmt, clippy, 100 % line coverage"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  { task = "cover" },
]

[tasks.cover]
description = "the end-to-end suite under llvm-cov; anything under 100 % of lines fails, naming the lines"
run = "cargo llvm-cov --fail-under-lines 100 --show-missing-lines"

[tasks.install]
description = "release build to ~/.local/bin/sandman-next, beside the live sandman"
run = "cargo build --release && install -m 755 target/release/sandman ~/.local/bin/sandman-next"
